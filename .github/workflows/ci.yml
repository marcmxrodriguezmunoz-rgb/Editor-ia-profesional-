name: Validate editor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Set up FFmpeg and FFprobe
        timeout-minutes: 3
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          # The fixture generator needs testsrc2. The app needs the newer scale filter.
          remotion_ffmpeg="$GITHUB_WORKSPACE/node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg"
          test -x "$remotion_ffmpeg"
          printf 'FFMPEG_PATH=%s\n' "$remotion_ffmpeg" >> "$GITHUB_ENV"
          tools_dir="$RUNNER_TEMP/editor-media-tools"
          npm install --prefix "$tools_dir" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          chmod +x "$tools_dir/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" \
            "$tools_dir/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          printf '%s\n' "$tools_dir/node_modules/@ffmpeg-installer/linux-x64" \
            "$tools_dir/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
      - name: Install Playwright Chromium
        timeout-minutes: 4
        run: npx playwright install chromium
      - name: Use Playwright Chromium for local rendering
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CHROME_PATH=' + require('@playwright/test').chromium.executablePath() + '\n')"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
